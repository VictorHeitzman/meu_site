<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecione a Loja — Painel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center font-bold">
        <i data-lucide="store" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-white">Suas Lojas</h1>
      <p class="text-xs text-slate-400">Escolha qual loja deseja gerenciar agora:</p>
    </div>

    <!-- CONTAINER DA LISTA DE LOJAS -->
    <div id="lista-lojas" class="space-y-3 pt-2">
      <!-- Inserido dinamicamente via JS -->
    </div>

    <div class="text-center pt-2">
      <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-300 transition">
        Sair ou usar outra conta
      </button>
    </div>

  </div>

    <script>
    lucide.createIcons();

    const lojasData = localStorage.getItem('contas_lojas');

    if (!lojasData) {
        window.location.href = '/login';
    } else {
        const lojas = JSON.parse(lojasData);
        const container = document.getElementById('lista-lojas');

        container.innerHTML = lojas.map(loja => `
        <button onclick="acessarLoja('${loja.id}', '${loja.slug}')" 
                class="w-full p-4 bg-slate-800/60 hover:bg-indigo-600/10 hover:border-indigo-500/50 border border-slate-700/60 rounded-2xl transition flex items-center justify-between group text-left">
            <div class="space-y-0.5">
            <p class="font-bold text-sm text-white group-hover:text-indigo-400 transition">${loja.nome}</p>
            <p class="text-xs text-slate-400">/${loja.slug}</p>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500 group-hover:text-indigo-400 transition"></i>
        </button>
        `).join('');
        
        lucide.createIcons();
    }

    function acessarLoja(id, slug) {
        // SALVA O TOKEN ESPECÍFICO DESSA LOJA NO LOCALSTORAGE
        localStorage.setItem(`session_admin_${slug}`, id);
        
        // REDIRECIONA PARA O PAINEL ADMIN DA LOJA
        window.location.href = `/admin/${slug}`;
    }

    function logout() {
        localStorage.removeItem('contas_lojas');
        window.location.href = '/login';
    }
    </script>
</body>
</html>
