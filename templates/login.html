<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Painel do Lojista</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS Customizado da Tela de Login -->
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

  <main class="w-full max-w-sm bg-white rounded-3xl p-8 shadow-2xl border border-slate-100 space-y-6">
    
    <!-- Cabeçalho Institucional -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-sm">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Painel do Lojista</h1>
      <p class="text-xs text-slate-500 font-medium">Informe suas credenciais para gerenciar seu catálogo</p>
    </div>

    <!-- Alerta de Erro -->
    <div id="alerta-erro" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl font-semibold text-center"></div>

    <!-- Formulário de Autenticação -->
    <form onsubmit="realizarLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">E-mail de Acesso</label>
        <input type="email" id="login_email" required placeholder="seu@email.com"
               class="w-full p-3 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Senha</label>
        <input type="password" id="login_senha" required placeholder="••••••••"
               class="w-full p-3 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 transition">
      </div>

      <button type="submit" id="btn-entrar"
              class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-xs shadow-lg shadow-indigo-200 transition active:scale-[0.98]">
        Entrar no Painel
      </button>
    </form>

  </main>

  <!-- Script de Login -->
  <script src="/static/js/login.js"></script>
</body>
</html>
