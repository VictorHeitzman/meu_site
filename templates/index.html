<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Digital</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS Customizado da Vitrine -->
  <link rel="stylesheet" href="/static/css/vitrine.css" />
</head>
<body class="min-h-screen antialiased flex flex-col pb-16 sm:pb-0">

  <!-- Status de Carregamento / Erro -->
  <div id="carregando" class="flex-1 flex flex-col items-center justify-center p-6 text-slate-500 gap-3">
    <div class="w-10 h-10 border-4 border-slate-300 border-t-indigo-600 rounded-full animate-spin"></div>
    <p class="text-xs font-semibold tracking-wide">Carregando vitrine...</p>
  </div>
  <div id="erro" class="hidden flex-1 flex items-center justify-center p-6 text-center text-rose-600 font-medium"></div>

  <!-- Aplicação Principal -->
  <div id="app" class="hidden flex-1 flex flex-col">
    
    <!-- BANNER DE CAPA DA LOJA (SEM CORTES) -->
    <!-- <div id="banner-wrap" class="hidden relative w-full bg-slate-950 flex items-center justify-center overflow-hidden">
      <img id="banner" alt="Capa da Loja" class="w-full max-h-[380px] sm:max-h-[480px] object-contain transition-all duration-300" />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent pointer-events-none"></div>
    </div> -->
    <!-- BANNER DE CAPA DA LOJA (PROPORCIONAL FLUIDO) -->
    <div id="banner-wrap" class="hidden relative w-full aspect-[3/1] sm:aspect-[4/1] bg-slate-950 overflow-hidden">
      <img id="banner" alt="Capa da Loja" class="w-full h-full object-cover object-center transition-all duration-300" />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent pointer-events-none"></div>
    </div>

    <!-- HEADER DA LOJA -->
    <header id="loja-header" class="sticky top-0 z-30 bg-primaria text-white shadow-xl transition-colors">
      <div class="mx-auto max-w-5xl px-4 py-3 flex items-center gap-3.5">
        
        <!-- Logo em Destaque -->
        <div id="logo-container" class="hidden relative shrink-0">
          <img id="logo" alt="Logo" class="w-14 h-14 sm:w-20 sm:h-20 rounded-2xl object-cover ring-4 ring-white/20 bg-slate-800 shadow-xl" />
        </div>

        <!-- Nome e Subtítulo -->
        <div class="min-w-0 flex-1">
          <h1 id="loja-nome" class="truncate text-base sm:text-xl font-extrabold tracking-tight"></h1>
          <p id="loja-subtitulo" class="truncate text-xs text-white/80 mt-0.5 whitespace-pre-line leading-relaxed"></p> 
        </div>
      </div>

      <!-- BARRA DE PESQUISA EM TEMPO REAL -->
      <div class="px-4 pb-2.5 mx-auto max-w-5xl">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-white/50"></i>
          <input type="text" id="input-busca" onkeyup="filtrarProdutosPorBusca(this.value)" placeholder="Buscar produtos ou serviços..." 
            class="w-full bg-white/10 text-white placeholder-white/50 pl-10 pr-4 py-2 rounded-xl text-xs outline-none focus:bg-white/20 backdrop-blur-md transition">
        </div>
      </div>

      <!-- CARROSSEL DE CATEGORIAS (FILTRO TOP) -->
      <nav id="abas-container" class="border-t border-white/10 bg-black/20 px-4">
        <div id="abas-list" class="mx-auto flex max-w-5xl gap-2 overflow-x-auto py-2.5 no-scrollbar text-xs">
          <!-- Categorias dinâmicas via JS -->
        </div>
      </nav>
    </header>

    <!-- FEED / GRID DE PRODUTOS -->
    <main id="conteudo" class="mx-auto w-full max-w-5xl flex-1 space-y-8 px-4 py-6"></main>

    <!-- RODAPÉ -->
    <footer class="border-t border-slate-200/80 bg-white py-8 text-center text-xs text-slate-500">
      <div class="mx-auto max-w-5xl px-4 space-y-2">
        <p id="loja-rodape" class="whitespace-pre-line text-xs font-medium text-slate-600 leading-relaxed"></p>
        <p class="text-[10px] text-slate-400">Powered by Catálogo Digital</p>
      </div>
    </footer>

    <!-- BOTÃO FLUTUANTE DO CARRINHO COM BADGE DE CONTADOR -->
    <button id="btn-carrinho-flutuante" onclick="abrirCarrinho()" 
            class="fixed bottom-5 right-5 z-40 bg-emerald-600 hover:bg-emerald-500 text-white p-3.5 rounded-full shadow-2xl flex items-center justify-center transition-all hover:scale-105 active:scale-95 group">
      <div class="relative">
        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
        <span id="carrinho-qtd-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow">
          0
        </span>
      </div>
      <span class="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-300 ease-in-out text-xs font-bold pl-0 group-hover:pl-2">
        Ver Sacola
      </span>
    </button>

    <!-- DRAWER (ABA LATERAL) DO CARRINHO DE COMPRAS -->
    <div id="modal-carrinho" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex justify-end transition-all">
      <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col justify-between">
        
        <!-- Header do Carrinho -->
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-900 text-white">
          <div class="flex items-center gap-2">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-emerald-400"></i>
            <h3 class="font-bold text-sm">Sua Sacola de Pedidos</h3>
          </div>
          <button onclick="fecharCarrinho()" class="p-1 rounded-lg text-slate-400 hover:text-white transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Lista de Itens do Carrinho -->
        <div id="carrinho-itens-lista" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100">
          <!-- Renderizado via JavaScript -->
        </div>

        <!-- Footer com Total e Botão do WhatsApp -->
        <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
          <div class="flex justify-between items-center text-slate-900 font-extrabold text-base">
            <span>Total Estimado:</span>
            <span id="carrinho-total-valor" class="text-emerald-600">R$ 0,00</span>
          </div>

          <button onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-lg transition active:scale-[0.98]">
            <i data-lucide="message-circle" class="w-5 h-5"></i>
            <span>Enviar Pedido no WhatsApp</span>
          </button>
        </div>

      </div>
    </div>

  <!-- MODAL DE DETALHES E FOTOS DO PRODUTO -->
  <div id="modal-produto" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-md p-0 sm:p-4 transition-all overflow-y-auto">
    <div class="relative w-full max-w-lg max-h-[92vh] rounded-t-3xl sm:rounded-3xl bg-white shadow-2xl flex flex-col overflow-hidden">
      
      <!-- BOTÃO FECHAR FIXO NO TOPO (NUNCA VAI SUMIR OU FICAR CORTADO) -->
      <button onclick="fecharModal()" type="button" 
              class="absolute top-3 right-3 flex h-9 w-9 items-center justify-center rounded-full bg-black/60 text-white hover:bg-black/80 transition z-30 backdrop-blur-sm shadow-md">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- CONTAINER DA IMAGEM PRINCIPAL (ADAPTÁVEL A FOTOS DO INSTAGRAM) -->
      <div class="relative bg-slate-950 flex items-center justify-center min-h-[220px] max-h-[45vh] sm:max-h-[360px] p-2 shrink-0 overflow-hidden">
        <img id="modal-img-principal" src="" alt="" class="max-h-[42vh] sm:max-h-[340px] w-auto max-w-full object-contain rounded-xl transition-all duration-200" />
      </div>

      <!-- GALERIA DE MINIATURAS -->
      <div id="modal-galeria" class="hidden gap-2 overflow-x-auto p-3 bg-slate-100 border-b no-scrollbar shrink-0"></div>

      <!-- CORPO DE TEXTO DO PRODUTO (ROLA CASO A DESCRIÇÃO SEJA LONGA) -->
      <div class="p-5 flex-1 space-y-2.5 overflow-y-auto">
        <div>
          <h2 id="modal-titulo" class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight pr-6"></h2>
          <div id="modal-preco" class="mt-1"></div>
        </div>
        <p id="modal-descricao" class="text-xs text-slate-600 leading-relaxed whitespace-pre-line"></p>
      </div>

      <!-- RODAPÉ COM BOTÃO DE AÇÃO FIXO -->
      <div class="p-4 bg-slate-50 border-t sticky bottom-0 shrink-0">
        <a id="modal-btn-action" href="#" target="_blank" rel="noopener noreferrer"
           class="flex w-full items-center justify-center gap-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 py-3.5 text-center text-sm font-bold text-white shadow-lg transition active:scale-[0.98]">
          <i data-lucide="message-circle" class="w-5 h-5"></i>
          <span id="modal-btn-texto">Entrar em Contato</span>
        </a>
      </div>

    </div>
  </div>

  <!-- Script da Vitrine -->
  <script src="/static/js/vitrine.js"></script>
</body>
</html>
